<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد أضحى مبارك يا دلال 🐑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;scroll-behavior:smooth}
body{
  font-family:'Cairo','Tajawal',sans-serif;
  background:#1a0f0a;color:#f4e4c1;min-height:100vh;
  direction:rtl;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(244,208,63,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(196,69,105,0.06) 0%, transparent 50%),
    linear-gradient(135deg,#1a0f0a 0%,#2a1a14 50%,#1a0f0a 100%);
}
.stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.star-dot{
  position:absolute;width:2px;height:2px;background:#fff8c0;border-radius:50%;
  box-shadow:0 0 6px rgba(244,208,63,0.6);
  animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.3)}}
#welcome-screen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:radial-gradient(ellipse at center,#2a1a14 0%,#0f0806 100%);
  transition:opacity 1s ease,visibility 1s ease;
}
#welcome-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.welcome-sheep{
  width:180px;height:180px;margin-bottom:30px;
  animation:sheepBounce 2s ease-in-out infinite;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,0.5));
}
@keyframes sheepBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-15px) rotate(3deg)}}
.welcome-title{
  font-family:'Aref Ruqaa',serif;font-size:48px;color:#f4d03f;
  text-align:center;margin-bottom:15px;font-weight:700;
  text-shadow:0 0 30px rgba(244,208,63,0.5);
}
.welcome-subtitle{font-size:20px;color:#e8c494;text-align:center;margin-bottom:40px;max-width:80%;line-height:1.8}
.welcome-btn{
  padding:18px 50px;font-size:18px;font-family:'Cairo',sans-serif;
  color:#1a0f0a;background:linear-gradient(135deg,#f4d03f 0%,#d4af37 100%);  border:none;border-radius:50px;cursor:pointer;font-weight:900;
  box-shadow:0 8px 30px rgba(212,175,55,0.5),0 0 60px rgba(244,208,63,0.3);
  transition:all .3s;
}
.welcome-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(212,175,55,0.7)}
.welcome-btn:active{transform:scale(0.96)}
.hero{
  position:relative;z-index:2;padding:60px 20px 40px;text-align:center;
  opacity:0;transform:translateY(30px);transition:all 1.2s ease;
}
.hero.visible{opacity:1;transform:translateY(0)}
.hero-sheep-container{width:200px;height:200px;margin:0 auto 30px}
.hero-sheep{
  width:100%;height:100%;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4));
  animation:sheepWalk 3s ease-in-out infinite;
}
@keyframes sheepWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-title{
  font-family:'Aref Ruqaa',serif;font-size:48px;color:#f4d03f;
  margin-bottom:15px;font-weight:700;
  text-shadow:0 0 30px rgba(244,208,63,0.5);
}
.section{
  position:relative;z-index:2;
  max-width:800px;margin:70px auto;padding:0 20px;
  opacity:0;transform:translateY(40px);transition:all 1s ease;
}
.section.visible{opacity:1;transform:translateY(0)}
.section-title{
  font-family:'Aref Ruqaa',serif;font-size:42px;color:#f4d03f;
  text-align:center;margin-bottom:10px;font-weight:700;
  text-shadow:0 0 20px rgba(244,208,63,0.4);
}
.section-subtitle{font-size:17px;color:#e8c494;text-align:center;margin-bottom:35px;opacity:0.85}
.section-divider{display:flex;align-items:center;justify-content:center;margin:50px auto;max-width:300px}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(244,208,63,0.5),transparent);
}
.section-divider-emoji{margin:0 15px;font-size:24px}
.letter-card{
  background:linear-gradient(135deg,rgba(244,228,193,0.08),rgba(196,69,105,0.08));
  border:1px solid rgba(244,208,63,0.3);
  border-radius:20px;padding:40px 30px;text-align:center;
  backdrop-filter:blur(10px);
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}
.letter-text{
  font-family:'Aref Ruqaa',serif;  font-size:30px;color:#f4d03f;line-height:2;font-weight:700;
  text-shadow:0 0 20px rgba(244,208,63,0.4);
  min-height:100px;
}
.letter-cursor{
  display:inline-block;width:3px;height:36px;background:#f4d03f;
  margin-right:5px;vertical-align:middle;
  animation:blink-cursor .75s step-end infinite;
}
@keyframes blink-cursor{from,to{opacity:0}50%{opacity:1}}
.sheep-stage{max-width:400px;margin:0 auto;text-align:center}
.sheep-interactive{
  width:200px;height:200px;margin:0 auto;cursor:pointer;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,0.5));
  transition:transform .3s;
  animation:sheepWalk 3s ease-in-out infinite;
}
.sheep-interactive:hover{transform:scale(1.05)}
.sheep-interactive:active{transform:scale(0.95)}
.sheep-message{
  margin-top:25px;min-height:60px;
  font-size:22px;color:#e8c494;
  text-align:center;line-height:1.7;font-weight:700;
  opacity:0;transition:opacity .5s;
}
.sheep-message.show{opacity:1}
.footer{
  text-align:center;padding:40px 20px;
  font-size:17px;color:rgba(244,208,63,0.6);
  border-top:1px solid rgba(244,208,63,0.15);margin-top:40px;
}
.fireworks-canvas{position:fixed;inset:0;z-index:999;pointer-events:none}
.floating-msg{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#c44569,#8b2c4a);
  color:#f4d03f;border:2px solid rgba(244,208,63,0.5);
  border-radius:50px;padding:15px 30px;font-size:18px;font-weight:900;
  z-index:1000;pointer-events:none;max-width:90%;
  box-shadow:0 10px 40px rgba(196,69,105,0.5);
  animation:floatMsg 3s ease forwards;
}
@keyframes floatMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}40%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.confetti{position:fixed;width:10px;height:14px;pointer-events:none;z-index:998;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.flying-heart{position:fixed;font-size:30px;pointer-events:none;z-index:997;animation:heartFly 2s ease-out forwards}
@keyframes heartFly{0%{opacity:1;transform:translateY(0) scale(0.5)}50%{opacity:1;transform:translateY(-100px) scale(1.2)}100%{opacity:0;transform:translateY(-200px) scale(0.8)}}
@media(max-width:600px){
  .welcome-title{font-size:36px}.welcome-subtitle{font-size:17px}
  .hero-title{font-size:36px}.hero-sheep-container{width:160px;height:160px}
  .section-title{font-size:32px}.letter-text{font-size:24px}  .sheep-interactive{width:160px;height:160px}
}
</style>
</head>

<script>
const sheepMessages = [
  "mää! عيد سعيد يا دلال! 🐑💕",
  "أنا الخروف الكيوت جيت أقول لك: أسامة يحبج! 💝",
  "mää mää! كل عام وأنتِ عيدي! 🌟",
  "عيد سعيد يا أحلى دلال! 🐑✨",
  "الخروف يقول: أسامة يحبج وااايد! 💖",
  "määä! كل عيد وأنتِ فرحة أسامة! 🌸",
  "أسامة يقول إنج أجمل شيء صار له! 💕",
  "mää mää! كل عام وأنتِ نور حياته! ✨",
  "الخروف يقول: أنتِ العيد الحقيقي! 🐑💝",
  "mää! كل عام وأنتِ ضحكتنا! 🌟"
];

// ✅ الرسالة المطلوبة بالضبط
const letterText = "يا دلال، عيد أضحى مبارك. أبيك تعرفين انك أحلى شيء في حياتي، وكل عيد وأنتِ معي هو العيد الحقيقي. أسأل الله يجمعنا قريب ويخليني جنبك دائماً";

const $ = id => document.getElementById(id);
let sheepMsgIdx = -1;
let letterDone = false;

function createStars(){
  const container = $('stars-bg');
  for(let i = 0; i < 80; i++){
    const star = document.createElement('div');
    star.className = 'star-dot';
    star.style.left = Math.random()*100+'%';
    star.style.top = Math.random()*100+'%';
    star.style.animationDelay = Math.random()*3+'s';
    star.style.animationDuration = (2 + Math.random()*2)+'s';
    container.appendChild(star);
  }
}
createStars();

$('welcome-btn').addEventListener('click', () => {
  $('welcome-screen').classList.add('hidden');
  setTimeout(() => {
    $('welcome-screen').style.display = 'none';
    $('main-content').style.display = 'block';
    initMainExperience();
  }, 1000);
});
function initMainExperience(){
  initSheep();
  initFireworks();
  setTimeout(() => {
    launchFireworksBurst(3);
    createConfetti(80);
    showFloatingMsg('🐑 عيد أضحى مبارك يا دلال 🐑');
  }, 500);
  setTimeout(setupScrollObserver, 300);
  setTimeout(() => {
    $('hero').classList.add('visible');
    setTimeout(startLetter, 1200);
  }, 800);
}

function startLetter(){
  if(letterDone) return;
  letterDone = true;
  const el = $('letter-text');
  const cursor = document.createElement('span');
  cursor.className = 'letter-cursor';
  el.appendChild(cursor);
  let i = 0;
  function type(){
    if(i < letterText.length){
      el.insertBefore(document.createTextNode(letterText.charAt(i)), cursor);
      i++;
      setTimeout(type, 35);
    } else {
      setTimeout(() => cursor.remove(), 1500);
    }
  }
  type();
}

function initSheep(){
  const sheep = $('sheep-interactive');
  const message = $('sheep-message');
  sheep.addEventListener('click', () => {
    let idx;
    do { idx = Math.floor(Math.random()*sheepMessages.length); }
    while(idx === sheepMsgIdx && sheepMessages.length > 1);
    sheepMsgIdx = idx;
    message.classList.remove('show');
    setTimeout(() => {
      message.textContent = sheepMessages[idx];
      message.classList.add('show');
    }, 200);
    playPop();    const rect = sheep.getBoundingClientRect();
    for(let i = 0; i < 3; i++){
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'flying-heart';
        const emojis = ['💖','💕','💝','🐑','✨'];
        heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        heart.style.left = (rect.left + rect.width/2 + (Math.random()-0.5)*60) + 'px';
        heart.style.top = (rect.top + rect.height/2) + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2000);
      }, i * 100);
    }
  });
  setTimeout(() => message.classList.add('show'), 500);
}

function setupScrollObserver(){
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, {threshold:0.15});
  document.querySelectorAll('.section').forEach(s => obs.observe(s));
}

let fwCanvas, fwCtx;
let fireworkParticles = [];
let activeRockets = [];
function initFireworks(){
  fwCanvas = $('fireworks-canvas');
  fwCtx = fwCanvas.getContext('2d');
  resizeFw();
  drawFireworks();
}
function resizeFw(){ if(!fwCanvas) return; fwCanvas.width = innerWidth; fwCanvas.height = innerHeight; }
window.addEventListener('resize', resizeFw);

class FireworkRocket{
  constructor(){
    this.x = Math.random() * innerWidth;
    this.targetY = innerHeight * 0.2 + Math.random() * innerHeight * 0.3;
    this.y = innerHeight; this.speed = 6;
    this.color = ['#f4d03f','#c44569','#ff9ec7','#fff','#d4af37','#ff6b9d'][Math.floor(Math.random()*6)];
    this.exploded = false; this.trail = [];
  }
  update(){
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length > 8) this.trail.shift();
    this.y -= this.speed;
    if(this.y <= this.targetY && !this.exploded){ this.exploded = true; this.explode(); return true; }
    return false;  }
  draw(){
    if(this.exploded) return;
    this.trail.forEach((t,i) => {
      fwCtx.save(); fwCtx.globalAlpha = (i/this.trail.length)*0.5; fwCtx.fillStyle = this.color;
      fwCtx.beginPath(); fwCtx.arc(t.x,t.y,1.5,0,Math.PI*2); fwCtx.fill(); fwCtx.restore();
    });
    fwCtx.save(); fwCtx.fillStyle = this.color; fwCtx.shadowBlur = 15; fwCtx.shadowColor = this.color;
    fwCtx.beginPath(); fwCtx.arc(this.x,this.y,2.5,0,Math.PI*2); fwCtx.fill(); fwCtx.restore();
  }
  explode(){
    const count = 60 + Math.floor(Math.random()*20);
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2/count)*i; const speed = Math.random()*3+2;
      fireworkParticles.push({x:this.x,y:this.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color:this.color,life:1,decay:Math.random()*0.015+0.01,size:Math.random()*2+1,trail:[]});
    }
  }
}
function launchFirework(){ if(!fwCanvas) return; activeRockets.push(new FireworkRocket()); }
function launchFireworksBurst(count=3){ for(let i=0;i<count;i++) setTimeout(()=>launchFirework(),i*200); }
function drawFireworks(){
  if(!fwCtx) return;
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  activeRockets = activeRockets.filter(r=>{ const done = r.update(); r.draw(); return !done; });
  fireworkParticles = fireworkParticles.filter(p=>{
    p.trail.push({x:p.x,y:p.y,life:p.life}); if(p.trail.length > 5) p.trail.shift();
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.99; p.life -= p.decay;
    if(p.life <= 0) return false;
    p.trail.forEach((t,i) => {
      fwCtx.save(); fwCtx.globalAlpha = (i/p.trail.length)*p.life*0.5; fwCtx.fillStyle = p.color;
      fwCtx.beginPath(); fwCtx.arc(t.x,t.y,p.size*0.7,0,Math.PI*2); fwCtx.fill(); fwCtx.restore();
    });
    fwCtx.save(); fwCtx.globalAlpha = p.life; fwCtx.fillStyle = p.color; fwCtx.shadowBlur = 12; fwCtx.shadowColor = p.color;
    fwCtx.beginPath(); fwCtx.arc(p.x,p.y,p.size,0,Math.PI*2); fwCtx.fill(); fwCtx.restore();
    return true;
  });
  requestAnimationFrame(drawFireworks);
}
function createConfetti(count=60){
  const colors = ['#f4d03f','#c44569','#ff9ec7','#fff','#d4af37','#ff6b9d'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100+'%'; c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (Math.random()*2+2)+'s'; c.style.animationDelay = Math.random()+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}
function showFloatingMsg(t){
  const m = document.createElement('div'); m.className = 'floating-msg'; m.textContent = t;  document.body.appendChild(m); setTimeout(()=>m.remove(),3000);
}
let audioCtx;
function playPop(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const bufSize = audioCtx.sampleRate * 0.1;
    const buf = audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufSize,4);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 800;
    const gain = audioCtx.createGain(); gain.gain.value = 0.2;
    src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); src.start(now);
  }catch(e){}
}
</script>
